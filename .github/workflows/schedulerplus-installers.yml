name: Scheduler{+} installers

# Builds Scheduler{+}'s installers for Linux, macOS and Windows from the
# private source repo (airadiolabs/musiccraft, read through the read-only
# deploy key SCHEDULERPLUS_DEPLOY_KEY) and attaches them to the release
# schedulerplus-vX.Y.Z here. Runs here because this repo is public, so
# Actions minutes are free. No source code is stored in this repo.
#
# A missing release is created as a DRAFT; publish it once every installer
# is attached and has been tried.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag or commit to build
        default: main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: the oldest supported Ubuntu, so the builds run on newer ones too
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: airadiolabs/musiccraft
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SCHEDULERPLUS_DEPLOY_KEY }}

      - name: Read the version from Cargo.toml
        id: version
        shell: bash
        run: echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Webview and packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev \
            libssl-dev patchelf rpm file

      - name: Build the installers
        shell: bash
        env:
          # linuxdeploy (AppImage) runs without FUSE on the runners
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: scripts/bundle --target ${{ matrix.target }}

      - name: Collect and name the installers
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          NAME: ${{ matrix.name }}
        run: |
          b="target/${{ matrix.target }}/release/bundle"
          base="schedulerplus-$VERSION-$NAME"
          mkdir out
          shopt -s nullglob
          for f in "$b"/deb/*.deb; do cp "$f" "out/$base.deb"; done
          for f in "$b"/rpm/*.rpm; do cp "$f" "out/$base.rpm"; done
          for f in "$b"/appimage/*.AppImage; do cp "$f" "out/$base.AppImage"; done
          for f in "$b"/dmg/*.dmg; do cp "$f" "out/$base.dmg"; done
          for f in "$b"/msi/*.msi; do cp "$f" "out/$base.msi"; done
          for f in "$b"/nsis/*-setup.exe; do cp "$f" "out/$base-setup.exe"; done
          ls -l out
          [ -n "$(ls out)" ] || { echo "no installers were built"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release schedulerplus-v${{ needs.build.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          tag="schedulerplus-v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --prerelease --title "Scheduler{+} $VERSION" \
              --notes "Scheduler{+} $VERSION for Linux, macOS and Windows. An early test build: please don't run a station on air with it yet, and back up your stations. These builds are not code-signed yet; see the README for first launch."
          fi
          gh release upload "$tag" dist/* --clobber
